<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniGo - AI Schedule Optimizer</title>
  <style>
    /* Base reset and global styles */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #1a1a2e;
      background-color: #f8fafc;
    }

    /* Ensure no horizontal scrollbar at any supported viewport width (320px-1920px) (Req 8.2) */
    body {
      max-width: 100vw;
    }

    /* App shell fills the viewport */
    app-shell {
      display: block;
      min-height: 100vh;
    }

    /* Global minimum touch-target size (Req 8.1) */
    button, a, [role="button"], input, select, textarea {
      min-height: 44px;
      min-width: 44px;
    }

    /* Global minimum font size (Req 8.1) */
    body, button, input, select, textarea {
      font-size: 16px;
    }

    /* Responsive: single-column on mobile (Req 8.2) */
    @media (max-width: 767px) {
      body {
        font-size: 16px;
      }
    }

    /* Responsive: multi-column capable on desktop (Req 8.2) */
    @media (min-width: 768px) {
      body {
        font-size: 16px;
      }
    }

    /* Smooth transitions for page-level state changes */
    app-shell {
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>
  <app-shell></app-shell>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
