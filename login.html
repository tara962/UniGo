<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniGo - Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>UniGo</h1>
      </div>
      <p class="auth-subtitle">Find your study vibe on campus</p>

      <!-- Toggle between Login / Sign Up -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Log In</button>
        <button class="auth-tab" id="tab-signup">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="login-form">
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" required>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="auth-submit">Log In</button>
        <p class="auth-error" id="login-error"></p>
      </form>

      <!-- Sign Up Form -->
      <form class="auth-form" id="signup-form" style="display:none;">
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="your@email.com" required>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Create password (min 6 chars)" minlength="6" required>
        </div>
        <div class="auth-field">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="Confirm password" minlength="6" required>
        </div>
        <button type="submit" class="auth-submit">Create Account</button>
        <p class="auth-error" id="signup-error"></p>
      </form>
    </div>
  </div>

  <script>
    // Tab switching
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      loginForm.style.display = 'block';
      signupForm.style.display = 'none';
    });

    tabSignup.addEventListener('click', () => {
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
      signupForm.style.display = 'block';
      loginForm.style.display = 'none';
    });

    // Sign Up
    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('signup-email').value.trim();
      const pass = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const errorEl = document.getElementById('signup-error');

      if (pass !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        return;
      }

      // Store user in localStorage
      const users = JSON.parse(localStorage.getItem('unigo-users') || '{}');
      if (users[email]) {
        errorEl.textContent = 'An account with this email already exists.';
        return;
      }

      users[email] = { password: pass };
      localStorage.setItem('unigo-users', JSON.stringify(users));
      localStorage.setItem('unigo-logged-in', email);
      
      // Redirect to options to set up profile
      window.location.href = 'options.html';
    });

    // Log In
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');

      const users = JSON.parse(localStorage.getItem('unigo-users') || '{}');
      if (!users[email] || users[email].password !== pass) {
        errorEl.textContent = 'Invalid email or password.';
        return;
      }

      localStorage.setItem('unigo-logged-in', email);
      window.location.href = 'index.html';
    });

    // If already logged in, redirect
    if (localStorage.getItem('unigo-logged-in')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
