AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  UniGo AI Schedule Optimizer - Serverless backend for optimizing university
  student schedules using Amazon Bedrock (Claude 3 Haiku).

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: AWS region for Bedrock API calls

Resources:
  ScheduleOptimizerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'unigo-schedule-optimizer-${Stage}'
      StageName: !Ref Stage
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              Access-Control-Allow-Methods: "'POST,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              Access-Control-Allow-Methods: "'POST,OPTIONS'"

  ScheduleOptimizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'unigo-schedule-optimizer-${Stage}'
      Handler: index.handler
      Runtime: nodejs20.x
      CodeUri: .
      Timeout: 30
      MemorySize: 256
      Description: >
        Processes schedule optimization requests by invoking Amazon Bedrock
        Claude 3 Haiku and returning validated time blocks.
      Environment:
        Variables:
          AWS_REGION_BEDROCK: !Ref BedrockRegion
          STAGE: !Ref Stage
      Policies:
        - Statement:
            - Sid: BedrockInvokeModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:${BedrockRegion}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
      Events:
        OptimizeSchedule:
          Type: Api
          Properties:
            RestApiId: !Ref ScheduleOptimizerApi
            Path: /optimize
            Method: POST

  ScheduleOptimizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/unigo-schedule-optimizer-${Stage}'
      RetentionInDays: 14

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL for the schedule optimizer
    Value: !Sub 'https://${ScheduleOptimizerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/optimize'

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ScheduleOptimizerFunction.Arn

  ApiId:
    Description: API Gateway ID
    Value: !Ref ScheduleOptimizerApi
